<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mi Vocabulario</title>
  <style>
    :root {
      --bg-color: #f1f3f5;
      --card-bg: #ffffff;
      --text-color: #212529;
      --sub-color: #6c757d;
      --accent-color: #0d6efd;
      --ex-color: #343a40;
      --en-color: #868e96;

      /* 品詞ごとのタグカラー */
      --tag-verb: #e6fcf5;      --tag-verb-text: #0ca678;   /* 動詞：エメラルド */
      --tag-m-noun: #e7f5ff;    --tag-m-noun-text: #1c7ed6; /* 男性名詞：ブルー */
      --tag-f-noun: #fff0f6;    --tag-f-noun-text: #d6336c; /* 女性名詞：ピンク */
      --tag-adj: #fff9db;       --tag-adj-text: #f59f00;    /* 形容詞：イエロー */
      --tag-other: #f1f3f5;     --tag-other-text: #495057;  /* その他：グレー */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px 0 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .header {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(241, 243, 245, 0.9);
      backdrop-filter: blur(8px);
      text-align: center;
      padding: 12px 0;
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--sub-color);
      z-index: 10;
      border-bottom: 1px solid #e9ecef;
      margin-bottom: 16px;
    }

    .card-list {
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      box-sizing: border-box;
    }

    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .word {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-color);
    }

    /* 品詞バッジ */
    .type-badge {
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    /* 品詞別スタイル割り当て */
    .type-v { background-color: var(--tag-verb); color: var(--tag-verb-text); }
    .type-m { background-color: var(--tag-m-noun); color: var(--tag-m-noun-text); }
    .type-f { background-color: var(--tag-f-noun); color: var(--tag-f-noun-text); }
    .type-adj { background-color: var(--tag-adj); color: var(--tag-adj-text); }
    .type-other { background-color: var(--tag-other); color: var(--tag-other-text); }

    .meaning {
      font-size: 1.1rem;
      color: var(--accent-color);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .example-box {
      background-color: #f8f9fa;
      border-left: 3px solid var(--accent-color);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .example-es {
      font-size: 0.95rem;
      color: var(--ex-color);
      font-weight: 600;
      line-height: 1.3;
    }

    .example-en {
      font-size: 0.82rem;
      color: var(--en-color);
      font-style: italic;
      line-height: 1.2;
    }

    .example-ja {
      font-size: 0.85rem;
      color: var(--sub-color);
      line-height: 1.3;
      margin-top: 2px;
    }

    .loading-sentinel {
      padding: 30px;
      text-align: center;
    }

    .load-more-btn {
      padding: 12px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background-color: var(--accent-color);
      color: white;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(13, 110, 253, 0.3);
    }
    .load-more-btn:active {
      opacity: 0.8;
    }
  </style>
</head>

    { id:"183", spanish:"recientemente", japanese: "最近、近頃", type: "adv", typeName: "副詞", exEs: "He leído un libro recientemente.", exEn: "I read a book recently.", exJa: "最近本を読みました。" },
    { id:"184", spanish:"relativamente", japanese: "比較的", type: "adv", typeName: "副詞", exEs: "Es un método relativamente nuevo.", exEn: "It is a relatively new method.", exJa: "比較的新しい方法です。" },
    { id:"185", spanish:"a través de", japanese: "〜を通して、〜経由で", type: "phrase", typeName: "熟語・成句", exEs: "A través del análisis de datos.", exEn: "Through data analysis.", exJa: "データ分析を通して。" },
    { id:"186", spanish:"al mismo tiempo", japanese: "同時に", type: "phrase", typeName: "熟語・成句", exEs: "Al mismo tiempo, hay riesgos.", exEn: "At the same time, there are risks.", exJa: "同時に、リスクも存在する。" },
    { id:"187", spanish:"con el fin de", japanese: "〜する目的で", type: "phrase", typeName: "熟語・成句", exEs: "Con el fin de mejorar la calidad.", exEn: "In order to improve quality.", exJa: "品質を向上させる目的で。" },
    { id:"188", spanish:"con respecto a", japanese: "〜に関して", type: "phrase", typeName: "熟語・成句", exEs: "Con respecto a este problema.", exEn: "With respect to this problem.", exJa: "この問題に関して。" },
    { id:"189", spanish:"de modo que", japanese: "〜となるように、したがって", type: "conj", typeName: "接続詞", exEs: "Trabaja de modo que funcione.", exEn: "Work so that it functions.", exJa: "しっかり機能するように作業しなさい。" },
    { id:"190", spanish:"en cambio", japanese: "それに対して、一方で", type: "phrase", typeName: "熟語・成句", exEs: "En cambio, la segunda opción es mejor.", exEn: "In contrast, the second option is better.", exJa: "それに対して、2つ目の選択肢の方が良い。" },
    { id:"191", spanish:"en consecuencia", japanese: "その結果として", type: "phrase", typeName: "熟語・成句", exEs: "En consecuencia, tomamos medidas.", exEn: "Consequently, we took measures.", exJa: "その結果、私たちは対策を講じた。" },
    { id:"192", spanish:"en todo caso", japanese: "いずれにせよ、ともかく", type: "phrase", typeName: "熟語・成句", exEs: "En todo caso, debemos continuar.", exEn: "In any case, we must continue.", exJa: "いずれにせよ、私たちは続けなければならない。" },
    { id:"193", spanish:"hasta cierto punto", japanese: "ある程度までは", type: "phrase", typeName: "熟語・成句", exEs: "Es verdad hasta cierto punto.", exEn: "It is true up to a point.", exJa: "ある程度までは事実だ。" },
    { id:"194", spanish:"por el contrario", japanese: "反対に、それどころか", type: "phrase", typeName: "熟語・成句", exEs: "Por el contrario, esto ayuda.", exEn: "On the contrary, this helps.", exJa: "反対に、これは助けになる。" },
    { id:"195", spanish:"sin duda", japanese: "疑いなく、確実に", type: "phrase", typeName: "熟語・成句", exEs: "Sin duda es el mejor camino.", exEn: "Without a doubt it is the best way.", exJa: "疑いなくそれが最善の道だ。" },
    { id:"196", spanish:"tarde o temprano", japanese: "遅かれ早かれ", type: "phrase", typeName: "熟語・成句", exEs: "Tarde o temprano llegará.", exEn: "Sooner or later it will arrive.", exJa: "遅かれ早かれそれはやってくる。" },
    { id:"197", spanish:"tener en cuenta", japanese: "考慮に入れる", type: "phrase", typeName: "熟語・成句", exEs: "Hay que tener en cuenta el costo.", exEn: "One must take into account the cost.", exJa: "コストを考慮に入れる必要がある。" },
    { id:"198", spanish:"vale la pena", japanese: "〜する価値がある", type: "phrase", typeName: "熟語・成句", exEs: "Vale la pena intentarlo.", exEn: "It is worth trying.", exJa: "試してみる価値はある。" },
    { id:"199", spanish:"ya que", japanese: "〜である以上、〜なので（= since / as）", type: "conj", typeName: "接続詞", exEs: "Ya que estás aquí, hablemos.", exEn: "Since you are here, let's talk.", exJa: "せっかくここにいるのだから、話しましょう。" },
    { id:"200", spanish:"bueno", japanese: "えーと、そうだね、じゃあ", type: "interj", typeName: "間投詞", exEs: "Bueno, vamos a empezar.", exEn: "Well, let's start.", exJa: "じゃあ、始めようか。" },
    { id:"201", spanish:"o sea", japanese: "つまり、要するに", type: "phrase", typeName: "熟語", exEs: "O sea, ¿no quieres ir?", exEn: "In other words, you don't want to go?", exJa: "つまり、行きたくないってこと？" },
    { id:"202", spanish:"la verdad", japanese: "実は、正直なところ", type: "phrase", typeName: "熟語", exEs: "La verdad, no me gusta mucho.", exEn: "To be honest, I don't really like it.", exJa: "正直、あまり好きじゃないんだ。" },
    { id:"203", spanish:"por cierto", japanese: "ところで、ちなみに", type: "phrase", typeName: "熟語", exEs: "Por cierto, ¿qué hiciste ayer?", exEn: "By the way, what did you do yesterday?", exJa: "ところで、昨日は何したの？" },
    { id:"204", spanish:"en fin", japanese: "まあ何はともあれ、とにかく", type: "phrase", typeName: "熟語", exEs: "En fin, todo salió bien.", exEn: "Anyway, everything turned out well.", exJa: "まあ何はともあれ、すべて上手くいったよ。" },
    { id:"205", spanish:"claro", japanese: "もちろん、なるほど、そうだよね", type: "interj", typeName: "間投詞", exEs: "¡Claro que sí!", exEn: "Of course!", exJa: "もちろんだよ！" },
    { id:"206", spanish:"seguro", japanese: "たしかに、きっと", type: "adv", typeName: "副詞", exEs: "Seguro que viene.", exEn: "I'm sure he is coming.", exJa: "きっと彼は来るよ。" },
    { id:"207", spanish:"¡Qué lástima!", japanese: "それは残念！", type: "interj", typeName: "間投詞", exEs: "¿No puedes venir? ¡Qué lástima!", exEn: "You can't come? What a pity!", exJa: "来られないの？残念！" },
    { id:"208", spanish:"¡Qué bueno!", japanese: "よかったね！最高！", type: "interj", typeName: "間投詞", exEs: "¿Pasaste el examen? ¡Qué bueno!", exEn: "You passed the exam? That's great!", exJa: "試験受かったの？よかったね！" },
    { id:"209", spanish:"depende", japanese: "〜による、場合による", type: "v", typeName: "動詞", exEs: "Depende del tiempo.", exEn: "It depends on the weather.", exJa: "天気次第かな。" },
    { id:"210", spanish:"quedarse", japanese: "とどまる、〜に残る", type: "v", typeName: "動詞", exEs: "Me quedo en casa hoy.", exEn: "I'm staying at home today.", exJa: "今日は家にいます。" },
    { id:"211", spanish:"olvidar", japanese: "忘れる", type: "v", typeName: "動詞", exEs: "Olvidé traer la llave.", exEn: "I forgot to bring the key.", exJa: "鍵を持ってくるのを忘れた。" },
    { id:"212", spanish:"cambiar", japanese: "変える、変わる", type: "v", typeName: "動詞", exEs: "Todo cambia rápido.", exEn: "Everything changes quickly.", exJa: "すべてが素早く変わる。" },
    { id:"213", spanish:"funcionar", japanese: "機能する、上手くいく", type: "v", typeName: "動詞", exEs: "Este plan funciona muy bien.", exEn: "This plan works very well.", exJa: "この計画はすごく上手くいっている。" },
    { id:"214", spanish:"sentirse", japanese: "〜と感じる、〜な気分である", type: "v", typeName: "動詞", exEs: "Me siento muy bien hoy.", exEn: "I feel very good today.", exJa: "今日はとても気分が良いです。" },
    { id:"215", spanish:"quizás", japanese: "たぶん、もしかすると", type: "adv", typeName: "副詞", exEs: "Quizás vaya mañana.", exEn: "Maybe I will go tomorrow.", exJa: "もしかしたら明日行くかも。" },
    { id:"216", spanish:"de repente", japanese: "突然、いきなり", type: "adv", typeName: "副詞", exEs: "De repente empezó a llover.", exEn: "Suddenly it started to rain.", exJa: "突然雨が降り出した。" },
    { id:"217", spanish:"despacio", japanese: "ゆっくり", type: "adv", typeName: "副詞", exEs: "Habla más despacio, por favor.", exEn: "Speak more slowly, please.", exJa: "もう少しゆっくり話してください。" },
    { id:"218", spanish:"enseguida", japanese: "すぐに、ただちに", type: "adv", typeName: "副詞", exEs: "Vuelvo enseguida.", exEn: "I'll be right back.", exJa: "すぐ戻ります。" },
    { id:"219", spanish:"bastante", japanese: "かなり、十分な", type: "adv", typeName: "副詞", exEs: "Es bastante interesante.", exEn: "It is quite interesting.", exJa: "かなり面白いね。" },
    { id:"220", spanish:"esto", japanese: "これ（指示代名詞）", type: "other", typeName: "代名詞", exEs: "¿Qué es esto?", exEn: "What is this?", exJa: "これは何ですか？" },
    { id:"221", spanish:"eso", japanese: "それ（指示代名詞）", type: "other", typeName: "代名詞", exEs: "Eso es使いやすさ. / Eso es verdad.", exEn: "That is true.", exJa: "それは本当です。" },
    { id:"222", spanish:"alguien", japanese: "誰か", type: "other", typeName: "代名詞", exEs: "¿Hay alguien aquí?", exEn: "Is there anyone here?", exJa: "誰かここにいますか？" },
    { id:"223", spanish:"algo", japanese: "何か", type: "other", typeName: "代名詞", exEs: "Quiero comer algo.", exEn: "I want to eat something.", exJa: "何か食べたいです。" },
    { id:"224", spanish:"nada", japanese: "何も〜ない", type: "other", typeName: "代名詞", exEs: "No pasa nada.", exEn: "Nothing is happening. / It's fine.", exJa: "問題ないよ、何でもないよ。" },
    { id:"225", spanish:"cerca", japanese: "近い、近くに", type: "adv", typeName: "副詞", exEs: "Está muy cerca de aquí.", exEn: "It is very close to here.", exJa: "ここからとても近いです。" },
    { id:"226", spanish:"lejos", japanese: "遠い、遠くに", type: "adv", typeName: "副詞", exEs: "¿Está lejos la estación?", exEn: "Is the station far away?", exJa: "駅は遠いですか？" },
    { id:"227", spanish:"antes", japanese: "以前に、前に", type: "adv", typeName: "副詞", exEs: "Llegué antes que tú.", exEn: "I arrived before you.", exJa: "君より前に着いたよ。" },
    { id:"228", spanish:"después", japanese: "後で、〜の後に", type: "adv", typeName: "副詞", exEs: "Nos vemos después.", exEn: "See you later.", exJa: "また後で会いましょう。" },
    { id:"229", spanish:"ya", japanese: "すでに、もう", type: "adv", typeName: "副詞", exEs: "Ya estoy listo.", exEn: "I am already ready.", exJa: "もう準備ができました。" },
    { id:"230", spanish:"todavía", japanese: "まだ、今なお", type: "adv", typeName: "副詞", exEs: "Todavía no lo sé.", exEn: "I still don't know it.", exJa: "まだそれを知りません。" },
    { id:"231", spanish:"seguro", japanese: "確信して、安全な", type: "adj", typeName: "形容詞", exEs: "¿Estás seguro?", exEn: "Are you sure?", exJa: "確かですか（本気ですか）？" },
    { id:"232", spanish:"mismo", japanese: "同じ（代名詞・強調）", type: "adj", typeName: "形容詞", exEs: "Yo mismo lo hice.", exEn: "I did it myself.", exJa: "自分自身でそれをやりました。" },
    { id:"233", spanish:"parecerse", japanese: "〜に似ている", type: "v", typeName: "動詞", exEs: "Te pareces a tu padre.", exEn: "You look like your father.", exJa: "お父さんに似ているね。" },
    { id:"234", spanish:"darse cuenta", japanese: "〜に気づく", type: "phrase", typeName: "熟語", exEs: "Me di cuenta del error.", exEn: "I realized the error.", exJa: "エラー（間違い）に気づきました。" },
    { id:"235", spanish:"tratar", japanese: "扱う、試みる（tratar de）", type: "v", typeName: "動詞", exEs: "Trato de aprender todos los días.", exEn: "I try to learn every day.", exJa: "毎日学ぶように努めています。" },
    { id:"236", spanish:"significar", japanese: "意味する", type: "v", typeName: "動詞", exEs: "¿Qué significa esta palabra?", exEn: "What does this word mean?", exJa: "この単語はどういう意味ですか？" },
    { id:"237", spanish:"suponer", japanese: "想定する、思い込む", type: "v", typeName: "動詞", exEs: "Supongo que sí.", exEn: "I suppose so.", exJa: "そうだと思います（たぶんね）。" },
    { id:"238", spanish:"esperanza", japanese: "希望", type: "f", typeName: "女性名詞", exEs: "Tengo la esperanza de viajar.", exEn: "I have the hope of traveling.", exJa: "旅行に行けるという希望を持っています。" },
    { id:"239", spanish:"éxito", japanese: "成功", type: "m", typeName: "男性名詞", exEs: "¡Mucho éxito en tu proyecto!", exEn: "Much success in your project!", exJa: "プロジェクトの成功を祈っています！" },
    { id:"240", spanish:"opinión", japanese: "意見、考え", type: "f", typeName: "女性名詞", exEs: "¿Cuál es tu opinión al respecto?", exEn: "What is your opinion on this matter?", exJa: "これについての君の意見は何？" },
    { id:"241", spanish:"posibilidad", japanese: "可能性", type: "f", typeName: "女性名詞", exEs: "Existe la posibilidad de cambio.", exEn: "There is a possibility of change.", exJa: "変更の可能性があります。" },
    { id:"242", spanish:"solución", japanese: "解決策、ソリューション", type: "f", typeName: "女性名詞", exEs: "Encontramos una solución práctica.", exEn: "We found a practical solution.", exJa: "実用的な解決策を見つけました。" },
    { id:"243", spanish:"duda", japanese: "疑問、ためらい", type: "f", typeName: "女性名詞", exEs: "No tengo ninguna duda.", exEn: "I have no doubt at all.", exJa: "何の疑問（迷い）もありません。" },
    { id:"244", spanish:"propósito", japanese: "目的、意図", type: "m", typeName: "男性名詞", exEs: "¿Cuál es el propósito del plan?", exEn: "What is the purpose of the plan?", exJa: "その計画の目的は何ですか？" },
    { id:"245", spanish:"depender", japanese: "依存する、〜次第である", type: "v", typeName: "動詞", exEs: "Todo depende de la situación.", exEn: "Everything depends on the situation.", exJa: "すべては状況次第です。" },
    { id:"246", spanish:"sugerir", japanese: "提案する", type: "v", typeName: "動詞", exEs: "Te sugiero probar otra forma.", exEn: "I suggest you try another way.", exJa: "別の方法を試すことを提案します。" },
    { id:"247", spanish:"explicar", japanese: "説明する", type: "v", typeName: "動詞", exEs: "¿Puedes explicar esto de nuevo?", exEn: "Can you explain this again?", exJa: "これをもっと詳しく説明できますか？" },
    { id:"248", spanish:"aprovechar", japanese: "活かす、活用する、利用する", type: "v", typeName: "動詞", exEs: "Hay que aprovechar la oportunidad.", exEn: "We must take advantage of the opportunity.", exJa: "その機会を活かす必要があります。" },
    { id:"249", spanish:"evitar", japanese: "避ける、防ぐ", type: "v", typeName: "動詞", exEs: "Debemos evitar errores graves.", exEn: "We must avoid serious mistakes.", exJa: "重大なミスを避けなければならない。" },
    { id:"250", spanish:"suficiente", japanese: "十分な", type: "adj", typeName: "形容詞", exEs: "Tenemos tiempo suficiente.", exEn: "We have enough time.", exJa: "十分な時間があります。" },
    { id:"251", spanish:"necesario", japanese: "必要な", type: "adj", typeName: "形容詞", exEs: "Es necesario hacer una prueba.", exEn: "It is necessary to run a test.", exJa: "テストを行うことが必要です。" },
    { id:"252", spanish:"frecuente", japanese: "頻繁な、度々の", type: "adj", typeName: "形容詞", exEs: "Es un problema bastante frecuente.", exEn: "It is a fairly frequent problem.", exJa: "これはかなり頻繁に起きる問題です。" },
    { id:"253", spanish:"probablemente", japanese: "たぶん、おそらく", type: "adv", typeName: "副詞", exEs: "Probablemente sea la mejor opción.", exEn: "It is probably the best option.", exJa: "おそらくそれが最善の選択肢でしょう。" },
    { id:"254", spanish:"desafortunadamente", japanese: "あいにく、残念ながら", type: "adv", typeName: "副詞", exEs: "Desafortunadamente no puedo ir.", exEn: "Unfortunately I cannot go.", exJa: "残念ながら私は行けません。" },
    { id:"255", spanish:"sin embargo", japanese: "しかしながら、けれども", type: "conj", typeName: "接続詞", exEs: "Es difícil, sin embargo posible.", exEn: "It is difficult, however possible.", exJa: "難しいですが、しかし可能です。" },
    { id:"256", spanish:"por lo tanto", japanese: "したがって、それゆえに", type: "conj", typeName: "接続詞", exEs: "Por lo tanto, debemos decidir hoy.", exEn: "Therefore, we must decide today.", exJa: "したがって、今日決定する必要があります。" },
    { id:"257", spanish:"a menos que", japanese: "〜でない限り（※要接続法）", type: "conj", typeName: "接続詞", exEs: "No iré a menos que me llames.", exEn: "I won't go unless you call me.", exJa: "君が電話してくらない限り行かないよ。" },
    { id:"258", spanish:"en lugar de", japanese: "〜の代わりに", type: "phrase", typeName: "熟語", exEs: "Usamos agua en lugar de leche.", exEn: "We use water instead of milk.", exJa: "牛乳の代わりに水を使います。" },
    { id:"259", spanish:"por supuesto", japanese: "もちろんです、当然ながら", type: "phrase", typeName: "熟語", exEs: "Por supuesto que te ayudaré.", exEn: "Of course I will help you.", exJa: "もちろん手伝いますよ。" },
    { id:"260", spanish:"aconsejar", japanese: "助言する、勧められる", type: "v", typeName: "動詞", exEs: "Te aconsejo que estudies todos los días.", exEn: "I advise you to study every day.", exJa: "毎日勉強することをお勧めします。" },
    { id:"261", spanish:"advertir", japanese: "警告する、気づかせる", type: "v", typeName: "動詞", exEs: "El experto advirtió sobre los riesgos del proyecto.", exEn: "The expert warned about the risks of the project.", exJa: "専門家はプロジェクトのリスクについて警告した。" },
    { id:"262", spanish:"amenazar", japanese: "脅かす、脅迫する", type: "v", typeName: "動詞", exEs: "El cambio climático amenaza la biodiversidad.", exEn: "Climate change threatens biodiversity.", exJa: "気候変動は生物多様性を脅かしている。" },
    { id:"263", spanish:"añadir", japanese: "追加する、付け加える", type: "v", typeName: "動詞", exEs: "Quisiera añadir un punto clave a la discusión.", exEn: "I would like to add a key point to the discussion.", exJa: "議論に重要なポイントを1つ付け加えたいと思います。" },
    { id:"264", spanish:"anunciar", japanese: "発表する、告知する", type: "v", typeName: "動詞", exEs: "La empresa anunció el lanzamiento del nuevo producto.", exEn: "The company announced the launch of the new product.", exJa: "会社は新製品の発売を発表した。" },
    { id:"265", spanish:"asegurar", japanese: "確信させる、保証する", type: "v", typeName: "動詞", exEs: "Nos aseguró que todo estaría listo a tiempo.", exEn: "He assured us that everything would be ready on time.", exJa: "彼はすべて時間通りに準備できると約束してくれた。" },
    { id:"266", spanish:"atender", japanese: "対応する、世話をする", type: "v", typeName: "動詞", exEs: "Debemos atender las necesidades del cliente rápidamente.", exEn: "We must attend to the customer's needs quickly.", exJa: "私たちは顧客のニーズに迅速に対応しなければならない。" },
    { id:"267", spanish:"aumentar", japanese: "増加する、増やす", type: "v", typeName: "動詞", exEs: "La demanda de tecnología sigue aumentando este año.", exEn: "The demand for technology continues to increase this year.", exJa: "テクノロジーの需要は今年増加し続けている。" },
    { id:"268", spanish:"averiguar", japanese: "調べる、突き止める", type: "v", typeName: "動詞", exEs: "Voy a averiguar la causa principal del fallo.", exEn: "I'm going to find out the main cause of the failure.", exJa: "障害の主な原因を突き止めるつもりです。" },
    { id:"269", spanish:"carecer", japanese: "欠けている、不足している", type: "v", typeName: "動詞", exEs: "El informe carece de datos suficientes para decidir.", exEn: "The report lacks sufficient data to make a decision.", exJa: "その報告書は決定を下すための十分なデータに欠けている。" },
    { id:"270", spanish:"comprobar", japanese: "確かめる、検証する", type: "v", typeName: "動詞", exEs: "Es necesario comprobar los resultados antes de publicar.", exEn: "It is necessary to check the results before publishing.", exJa: "公開する前に結果を検証することが必要だ。" },
    { id:"271", spanish:"conseguir", japanese: "手に入れる、達成する", type: "v", typeName: "動詞", exEs: "Consiguió solucionar el problema sin ayuda externa.", exEn: "He managed to solve the problem without external help.", exJa: "彼は外部の助けを借りずに問題を解決することができた。" },
    { id:"272", spanish:"considerar", japanese: "検討する、〜とみなす", type: "v", typeName: "動詞", exEs: "Consideramos imprescindible mejorar el proceso actual.", exEn: "We consider it essential to improve the current process.", exJa: "現在のプロセスを改善することは不可欠であると考えています。" },
    { id:"273", spanish:"convenir", japanese: "〜に都合が良い、望ましい", type: "v", typeName: "動詞", exEs: "Conviene revisar las cláusulas antes de firmar.", exEn: "It is advisable to review the clauses before signing.", exJa: "署名する前に条項を見直すのが望ましい。" },
    { id:"274", spanish:"despertar", japanese: "目覚めさせる、喚起する", type: "v", typeName: "動詞", exEs: "La conferencia despertó un gran interés público.", exEn: "The lecture aroused great public interest.", exJa: "その講演は世間の大きな関心を呼び起こした。" },
    { id:"275", spanish:"destacar", japanese: "強調する、目立つ", type: "v", typeName: "動詞", exEs: "Cabe destacar la importancia de la seguridad.", exEn: "It is worth highlighting the importance of security.", exJa: "セキュリティの重要性を強調しておく価値がある。" },
    { id:"276", spanish:"disminuir", japanese: "減少する、減らす", type: "v", typeName: "動詞", exEs: "Buscamos disminuir los costos de producción este trimestre.", exEn: "We seek to reduce production costs this quarter.", exJa: "今四半期は製造コストを削減することを目指しています。" },
    { id:"277", spanish:"exigir", japanese: "要求する、求める", type: "v", typeName: "動詞", exEs: "El nuevo cargo exige una alta responsabilidad.", exEn: "The new position requires high responsibility.", exJa: "新しい職務は高い責任を要求する。" },
    { id:"278", spanish:"garantizar", japanese: "保証する、約束する", type: "v", typeName: "動詞", exEs: "No podemos garantizar un éxito inmediato sin esfuerzo.", exEn: "We cannot guarantee immediate success without effort.", exJa: "努力なしに即座の成功を保証することはできません。" },
    { id:"279", spanish:"impedir", japanese: "妨げる、邪魔する", type: "v", typeName: "動詞", exEs: "La lluvia impidió que el evento se llevara a cabo.", exEn: "The rain prevented the event from taking place.", exJa: "雨のためイベントの実施が妨げられた。" },
    { id:"280", spanish:"influir", japanese: "影響を与える", type: "v", typeName: "動詞", exEs: "Factores externos pueden influir en el resultado final.", exEn: "External factors can influence the final result.", exJa: "外部要因が最終結果に影響を与える可能性がある。" },
    { id:"281", spanish:"insistir", japanese: "主張する、強く求める", type: "v", typeName: "動詞", exEs: "Ella insistió en revisar el documento otra vez.", exEn: "She insisted on reviewing the document again.", exJa: "彼女は文書をもう一度見直すことを強く主張した。" },
    { id:"282", spanish:"investigar", japanese: "調査する、研究する", type: "v", typeName: "動詞", exEs: "Un equipo especializado investigará el incidente.", exEn: "A specialized team will investigate the incident.", exJa: "専門チームがそのインシデントを調査する。" },
    { id:"283", spanish:"mantener", japanese: "維持する、保つ", type: "v", typeName: "動詞", exEs: "Es crucial mantener un equilibrio entre calidad y costo.", exEn: "It is crucial to maintain a balance between quality and cost.", exJa: "品質とコストのバランスを維持することが重要である。" },
    { id:"284", spanish:"negarse", japanese: "拒否する、断る", type: "v", typeName: "動詞", exEs: "Se negó a aceptar las condiciones impuestas.", exEn: "He refused to accept the imposed conditions.", exJa: "彼は課された条件を受け入れることを拒否した。" },
    { id:"285", spanish:"permitir", japanese: "許可する、可能にする", type: "v", typeName: "動詞", exEs: "Esta herramienta permite optimizar el flujo de trabajo.", exEn: "This tool allows optimizing the workflow.", exJa: "このツールによりワークフローを最適化できる。" },
    { id:"286", spanish:"proponer", japanese: "提案する", type: "v", typeName: "動詞", exEs: "Propongo organizar una reunión la próxima semana.", exEn: "I propose organizing a meeting next week.", exJa: "来週ミーティングを開催することを提案します。" },
    { id:"287", spanish:"recomendar", japanese: "勧める、推挙する", type: "v", typeName: "動詞", exEs: "Recomiendo que leas este libro de negocios.", exEn: "I recommend that you read this business book.", exJa: "このビジネス書を読むことをお勧めします。" },
    { id:"288", spanish:"reconocer", japanese: "認める、認識する", type: "v", typeName: "動詞", exEs: "El director reconoció el esfuerzo de todo el equipo.", exEn: "The director recognized the effort of the whole team.", exJa: "ディレクターはチーム全員の努力を認めた。" },
    { id:"289", spanish:"reducir", japanese: "減らす、縮小する", type: "v", typeName: "動詞", exEs: "Es urgente reducir la emisión de gases contaminantes.", exEn: "It is urgent to reduce the emission of polluting gases.", exJa: "汚染ガスの排出量を削減することは緊急の課題だ。" },
    { id:"290", spanish:"resolver", japanese: "解決する、決断する", type: "v", typeName: "動詞", exEs: "Debemos resolver este conflicto lo antes posible.", exEn: "We must resolve this conflict as soon as possible.", exJa: "できるだけ早くこのコンフリクト（対立）を解決しなければならない。" },
    { id:"291", spanish:"soportar", japanese: "耐える、我慢する", type: "v", typeName: "動詞", exEs: "No puedo soportar el ruido durante el trabajo.", exEn: "I cannot bear the noise during work.", exJa: "作業中の騒音には耐えられない。" },
    { id:"292", spanish:"sostener", japanese: "支える、持論を主張する", type: "v", typeName: "動詞", exEs: "El ponente sostuvo su teoría con datos precisos.", exEn: "The speaker supported his theory with precise data.", exJa: "登壇者は正確なデータで持論を裏付けた。" },
    { id:"293", spanish:"sustituir", japanese: "取って代わる、交換する", type: "v", typeName: "動詞", exEs: "Vamos a sustituir el sistema antiguo por uno moderno.", exEn: "We are going to replace the old system with a modern one.", exJa: "古いシステムを現代的なシステムにリプレイスする予定です。" },
    { id:"294", spanish:"variar", japanese: "変化する、異なる", type: "v", typeName: "動詞", exEs: "Los precios pueden variar según la temporada.", exEn: "Prices may vary depending on the season.", exJa: "価格は季節によって変動することがある。" },
    { id:"295", spanish:"avance", japanese: "進展、進歩", type: "m", typeName: "男性名詞", exEs: "El avance tecnológico cambia nuestra forma de vivir.", exEn: "Technological progress changes our way of living.", exJa: "技術の進歩は私たちの生き方を変える。" },
    { id:"296", spanish:"consecuencia", japanese: "結果、影響", type: "f", typeName: "女性名詞", exEs: "Cada acción tiene una consecuencia inevitable.", exEn: "Every action has an inevitable consequence.", exJa: "あらゆる行動には避けられない結果が伴う。" },
    { id:"297", spanish:"contexto", japanese: "文脈、状況・背景", type: "m", typeName: "男性名詞", exEs: "Es importante entender la palabra según el contexto.", exEn: "It is important to understand the word according to context.", exJa: "文脈に応じて単語を理解することが重要だ。" },
    { id:"298", spanish:"desarrollo", japanese: "開発、成長", type: "m", typeName: "男性名詞", exEs: "El desarrollo personal requiere paciencia y constancia.", exEn: "Personal development requires patience and perseverance.", exJa: "自己成長には忍耐と継続が必要だ。" },
    { id:"299", spanish:"discurso", japanese: "スピーチ、演説", type: "m", typeName: "男性名詞", exEs: "El presidente dio un discurso muy inspirador.", exEn: "The president gave a very inspiring speech.", exJa: "社長は非常に励みになるスピーチを行った。" },
    { id:"300", spanish:"efecto", japanese: "効果、影響", type: "m", typeName: "男性名詞", exEs: "La medida tuvo un efecto positivo inmediato.", exEn: "The measure had an immediate positive effect.", exJa: "その施策は即座に好影響をもたらした。" },
    { id:"301", spanish:"enfoque", japanese: "アプローチ、着眼点", type: "m", typeName: "男性名詞", exEs: "Necesitamos un nuevo enfoque para resolver el problema.", exEn: "We need a new approach to solve the problem.", exJa: "問題を解決するために新しいアプローチが必要です。" },
    { id:"302", spanish:"entorno", japanese: "環境、周囲の状況", type: "m", typeName: "男性名詞", exEs: "Debemos adaptarnos a un entorno digital cambiante.", exEn: "We must adapt to a changing digital environment.", exJa: "変化するデジタル環境に適応しなければならない。" },
    { id:"303", spanish:"evidencia", japanese: "証拠、明白さ", type: "f", typeName: "女性名詞", exEs: "No hay evidencia suficiente para confirmar la hipótesis.", exEn: "There is not enough evidence to confirm the hypothesis.", exJa: "仮説を証明する十分な証拠がない。" },
    { id:"304", spanish:"experiencia", japanese: "経験、体験", type: "f", typeName: "女性名詞", exEs: "La experiencia práctica es tan valiosa como la teoría.", exEn: "Practical experience is as valuable as theory.", exJa: "実践的な経験は理論と同じくらい価値がある。" },
    { id:"305", spanish:"impacto", japanese: "影響、インパクト", type: "m", typeName: "男性名詞", exEs: "El proyecto tuvo un gran impacto en la sociedad.", exEn: "The project had a great impact on society.", exJa: "そのプロジェクトは社会に大きなインパクトを与えた。" },
    { id:"306", spanish:"objetivo", japanese: "目的、目標", type: "m", typeName: "男性名詞", exEs: "El objetivo principal es aumentar la satisfacción.", exEn: "The main objective is to increase satisfaction.", exJa: "主な目標は満足度を高めることだ。" },
    { id:"307", spanish:"origen", japanese: "起源、由来", type: "m", typeName: "男性名詞", exEs: "El origen del problema aún es desconocido.", exEn: "The origin of the problem is still unknown.", exJa: "問題の原因（起源）は未だ不明である。" },
    { id:"308", spanish:"perspectiva", japanese: "視点、見地", type: "f", typeName: "女性名詞", exEs: "Ver la situación desde otra perspectiva ayuda mucho.", exEn: "Seeing the situation from another perspective helps a lot.", exJa: "別の視点から状況を見ることが大きな助けになる。" },
    { id:"309", spanish:"prioridad", japanese: "優先事項、優先順位", type: "f", typeName: "女性名詞", exEs: "Nuestra prioridad absoluta es la seguridad de los datos.", exEn: "Our absolute priority is data security.", exJa: "私たちの最優先事項はデータセキュリティです。" },
    { id:"310", spanish:"recurso", japanese: "資源、リソース", type: "m", typeName: "男性名詞", exEs: "Optimizamos el uso de los recursos disponibles.", exEn: "We optimize the use of available resources.", exJa: "利用可能なリソースの活用を最適化します。" },
    { id:"311", spanish:"resultado", japanese: "結果、成果", type: "m", typeName: "男性名詞", exEs: "Los resultados trimestrales superaron las expectativas.", exEn: "Quarterly results exceeded expectations.", exJa: "四半期業績は予想を上回った。" },
    { id:"312", spanish:"solución", japanese: "解決策", type: "f", typeName: "女性名詞", exEs: "Buscamos una solución sostenible a largo plazo.", exEn: "We are looking for a long-term sustainable solution.", exJa: "長期的で持続可能な解決策を探しています。" },
    { id:"313", spanish:"técnica", japanese: "技術、手法", type: "f", typeName: "女性名詞", exEs: "Esta técnica permite aprender más rápido.", exEn: "This technique allows you to learn faster.", exJa: "この手法を使えばより素早く学習できる。" },
    { id:"314", spanish:"ventaja", japanese: "利点、アドバンテージ", type: "f", typeName: "女性名詞", exEs: "La automatización ofrece una ventaja competitiva.", exEn: "Automation offers a competitive advantage.", exJa: "自動化は競争上の優位性（強み）をもたらす。" },
    { id:"315", spanish:"actual", japanese: "現在の、現代の", type: "adj", typeName: "形容詞", exEs: "La situación actual requiere decisiones rápidas.", exEn: "The current situation requires fast decisions.", exJa: "現在の状況は迅速な意思決定を求めている。" },
    { id:"316", spanish:"amplio", japanese: "広い、広範な", type: "adj", typeName: "形容詞", exEs: "El candidato posee un amplio conocimiento técnico.", exEn: "The candidate has broad technical knowledge.", exJa: "その候補者は広範な技術的知識を持っている。" },
    { id:"317", spanish:"anterior", japanese: "前の、前述の", type: "adj", typeName: "形容詞", exEs: "Como mencionamos en la sección anterior, es crucial.", exEn: "As mentioned in the previous section, it is crucial.", exJa: "前述のセクションで述べたように、これは重要である。" },
    { id:"318", spanish:"capaz", japanese: "能力がある、〜できる", type: "adj", typeName: "形容詞", exEs: "Es un ingeniero capaz de resolver problemas complejos.", exEn: "He is an engineer capable of solving complex problems.", exJa: "彼は複雑な問題を解決できる能力を持ったエンジニアだ。" },
    { id:"319", spanish:"clave", japanese: "鍵となる、決定的な", type: "adj", typeName: "形容詞", exEs: "El análisis de datos es el elemento clave.", exEn: "Data analysis is the key element.", exJa: "データ分析が鍵となる要素である。" },
    { id:"320", spanish:"constante", japanese: "一定の、継続的な", type: "adj", typeName: "形容詞", exEs: "El aprendizaje constante es esencial para el éxito.", exEn: "Constant learning is essential for success.", exJa: "絶え間ない学習が成功には不可欠だ。" },
    { id:"321", spanish:"diverso", japanese: "多様な、様々な", type: "adj", typeName: "形容詞", exEs: "El equipo está formado por personas de diversos orígenes.", exEn: "The team consists of people from diverse backgrounds.", exJa: "チームは多様なバックグラウンドを持つ人々で構成されている。" },
    { id:"322", spanish:"efectivo", japanese: "効果的な、実質的な", type: "adj", typeName: "形容詞", exEs: "Buscamos una estrategia efectiva de comunicación.", exEn: "We are looking for an effective communication strategy.", exJa: "効果的なコミュニケーション戦略を探しています。" },
    { id:"323", spanish:"esencial", japanese: "不可欠な、本質的な", type: "adj", typeName: "形容詞", exEs: "Es esencial verificar el código antes del despliegue.", exEn: "It is essential to verify code before deployment.", exJa: "デプロイ前にコードを検証することは不可欠だ。" },
    { id:"324", spanish:"extraño", japanese: "奇妙な、珍しい", type: "adj", typeName: "形容詞", exEs: "Sucedió algo extraño durante la prueba.", exEn: "Something strange happened during the test.", exJa: "テスト中に何か奇妙なことが起きた。" },
    { id:"325", spanish:"frecuente", japanese: "頻繁な", type: "adj", typeName: "形容詞", exEs: "Los errores humanos son la causa más frecuente.", exEn: "Human errors are the most frequent cause.", exJa: "ヒューマンエラーが最も頻繁な原因である。" },
    { id:"326", spanish:"grave", japanese: "深刻な、重い", type: "adj", typeName: "形容詞", exEs: "Cometer un error grave puede costar caro.", exEn: "Making a serious error can cost dearly.", exJa: "重大なエラーを犯すと高くつく可能性がある。" },
    { id:"327", spanish:"imprescindible", japanese: "絶対に不可欠な", type: "adj", typeName: "形容詞", exEs: "El trabajo en equipo es imprescindible hoy en día.", exEn: "Teamwork is indispensable nowadays.", exJa: "今日、チームワークは絶対に不可欠だ。" },
    { id:"328", spanish:"incapaz", japanese: "〜できない、無能な", type: "adj", typeName: "形容詞", exEs: "Fue incapaz de dar una respuesta clara.", exEn: "He was unable to give a clear answer.", exJa: "彼は明確な回答を出すことができなかった。" },
    { id:"329", spanish:"móvil", japanese: "可動性の、モバイルの", type: "adj", typeName: "形容詞", exEs: "El uso de dispositivos móviles sigue creciendo.", exEn: "The use of mobile devices continues to grow.", exJa: "モバイル端末の利用は拡大し続けている。" },
    { id:"330", spanish:"obvio", japanese: "明白な、自明の", type: "adj", typeName: "形容詞", exEs: "Es un hecho obvio que no necesita explicación.", exEn: "It is an obvious fact that needs no explanation.", exJa: "説明を要しない明白な事実だ。" },
    { id:"331", spanish:"posterior", japanese: "後方の、その後の", type: "adj", typeName: "形容詞", exEs: "Los detalles se discutirán en una reunión posterior.", exEn: "Details will be discussed in a later meeting.", exJa: "詳細は後日の会議で議論される。" },
    { id:"332", spanish:"profundo", japanese: "深い、深刻な", type: "adj", typeName: "形容詞", exEs: "Hicimos un análisis profundo sobre el mercado.", exEn: "We conducted a deep analysis of the market.", exJa: "市場に関する深い分析を行った。" },
    { id:"333", spanish:"sensible", japanese: "に敏感な、デリケートな", type: "adj", typeName: "形容詞", exEs: "Esta información es muy sensible y confidencial.", exEn: "This information is very sensitive and confidential.", exJa: "この情報は非常にデリケートで機密性が高い。" },
    { id:"334", spanish:"sostenible", japanese: "持続可能な", type: "adj", typeName: "形容詞", exEs: "Debemos promover un crecimiento económico sostenible.", exEn: "We must promote sustainable economic growth.", exJa: "持続可能な経済成長を促進しなければならない。" },
    { id:"335", spanish:"útil", japanese: "役に立つ、有用な", type: "adj", typeName: "形容詞", exEs: "Es una aplicación muy útil para la productividad.", exEn: "It is a very useful application for productivity.", exJa: "生産性向上に非常に役立つアプリです。" },
    { id:"336", spanish:"valioso", japanese: "貴重な、価値のある", type: "adj", typeName: "形容詞", exEs: "El tiempo es el recurso más valioso que tenemos.", exEn: "Time is the most valuable resource we have.", exJa: "時間は私たちが持つ最も貴重なリソースだ。" },
    { id:"337", spanish:"alrededor de", japanese: "〜の周りに、およそ", type: "other", typeName: "その他", exEs: "Llegaremos alrededor de las tres de la tarde.", exEn: "We will arrive around three in the afternoon.", exJa: "午後3時頃に到着する予定です。" },
    { id:"338", spanish:"a pesar de", japanese: "〜にもかかわらず", type: "other", typeName: "その他", exEs: "A pesar de las dificultades, logramos el objetivo.", exEn: "Despite the difficulties, we achieved the goal.", exJa: "困難にもかかわらず、目標を達成した。" },
    { id:"339", spanish:"a medida que", japanese: "〜するにつれて", type: "other", typeName: "その他", exEs: "A medida que avanzamos, surgen nuevas ideas.", exEn: "As we move forward, new ideas emerge.", exJa: "前に進むにつれて、新しいアイデアが生まれる。" },
    { id:"340", spanish:"a partir de", japanese: "〜以降、〜から", type: "other", typeName: "その他", exEs: "A partir de mañana, el horario cambiará.", exEn: "Starting tomorrow, the schedule will change.", exJa: "明日以降、スケジュールが変更になります。" },
    { id:"341", spanish:"a causa de", japanese: "〜が原因で", type: "other", typeName: "その他", exEs: "El retraso se debió a causa del mal tiempo.", exEn: "The delay was due to bad weather.", exJa: "遅延は悪天候が原因であった。" },
    { id:"342", spanish:"de acuerdo con", japanese: "〜に従って、〜によれば", type: "other", typeName: "その他", exEs: "De acuerdo con los informes, las ventas aumentaron.", exEn: "According to the reports, sales increased.", exJa: "報告書によれば、売上は増加した。" },
    { id:"343", spanish:"debido a", japanese: "〜に起因して、〜のために", type: "other", typeName: "その他", exEs: "Cancelamos el evento debido a imprevistos.", exEn: "We canceled the event due to unforeseen circumstances.", exJa: "不測の事態のためにイベントを中止した。" },
    { id:"344", spanish:"en cuanto a", japanese: "〜に関しては、〜について言うと", type: "other", typeName: "その他", exEs: "En cuanto a los costos, los discutiremos luego.", exEn: "As for the costs, we will discuss them later.", exJa: "コストに関しては、後ほど議論します。" },
    { id:"345", spanish:"en relación con", japanese: "〜に関連して", type: "other", typeName: "その他", exEs: "Escribo en relación con su consulta reciente.", exEn: "I am writing in relation to your recent inquiry.", exJa: "最近のお問い合わせに関連してご連絡しております。" },
    { id:"346", spanish:"frente a", japanese: "〜に直面して、〜に対して", type: "other", typeName: "その他", exEs: "Frente a la crisis, debemos actuar con calma.", exEn: "In the face of the crisis, we must act calmly.", exJa: "危機に直面して、私たちは冷静に行動しなければならない。" },
    { id:"347", spanish:"gracias a", japanese: "〜のおかげで", type: "other", typeName: "その他", exEs: "Gracias a tu ayuda, terminamos a tiempo.", exEn: "Thanks to your help, we finished on time.", exJa: "君の助けのおかげで時間通りに終わった。" },

    // 配列をシャッフル（フィッシャー–イェーツのシャッフル）
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const vocabulary = shuffle(rawVocabulary);
    //const vocabulary = rawVocabulary;

    let dataIndex = 0;
    let isLoading = false;

    const cardList = document.getElementById("cardList");
    const sentinel = document.getElementById("sentinel");

    function getBadgeClass(type) {
      switch(type) {
        case 'v': return 'type-v';
        case 'm': return 'type-m';
        case 'f': return 'type-f';
        case 'adj': return 'type-adj';
        default: return 'type-other';
      }
    }

    function loadMoreCards(batchSize = 10) {
      if (isLoading) return;
      isLoading = true;

      for (let i = 0; i < batchSize; i++) {
        const item = vocabulary[dataIndex];

        const card = document.createElement("div");
        card.className = "card";

        const badgeClass = getBadgeClass(item.type);

        card.innerHTML = `
          <div class="word-header">
            <span class="word">${item.spanish}</span>
            <span class="type-badge ${badgeClass}">${item.typeName}</span>
          </div>
          <div class="meaning">${item.japanese}</div>
          <div class="example-box">
            <div class="example-es">${item.exEs}</div>
            <div class="example-en">${item.exEn}</div>
            <div class="example-ja">${item.exJa}</div>
          </div>
        `;

        cardList.appendChild(card);
        dataIndex = (dataIndex + 1) % vocabulary.length;
      }

      cardList.after(sentinel);
      
      setTimeout(() => {
        isLoading = false;
      }, 100);
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !isLoading) {
          loadMoreCards(10);
        }
      });
    }, {
      rootMargin: "300px"
    });

    observer.observe(sentinel);

    // 初期ロード（15件）
    loadMoreCards(15);
  </script>
