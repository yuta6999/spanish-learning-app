<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mi Vocabulario</title>
  <style>
    :root {
      --bg-color: #f1f3f5;
      --card-bg: #ffffff;
      --text-color: #212529;
      --sub-color: #6c757d;
      --accent-color: #0d6efd;
      --ex-color: #343a40;
      --en-color: #868e96;

      /* 品詞ごとのタグカラー */
      --tag-verb: #e6fcf5;      --tag-verb-text: #0ca678;   /* 動詞：エメラルド */
      --tag-m-noun: #e7f5ff;    --tag-m-noun-text: #1c7ed6; /* 男性名詞：ブルー */
      --tag-f-noun: #fff0f6;    --tag-f-noun-text: #d6336c; /* 女性名詞：ピンク */
      --tag-adj: #fff9db;       --tag-adj-text: #f59f00;    /* 形容詞：イエロー */
      --tag-other: #f1f3f5;     --tag-other-text: #495057;  /* その他：グレー */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px 0 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .header {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(241, 243, 245, 0.9);
      backdrop-filter: blur(8px);
      text-align: center;
      padding: 12px 0;
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--sub-color);
      z-index: 10;
      border-bottom: 1px solid #e9ecef;
      margin-bottom: 16px;
    }

    .card-list {
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      box-sizing: border-box;
    }

    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .word {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-color);
    }

    /* 品詞バッジ */
    .type-badge {
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    /* 品詞別スタイル割り当て */
    .type-v { background-color: var(--tag-verb); color: var(--tag-verb-text); }
    .type-m { background-color: var(--tag-m-noun); color: var(--tag-m-noun-text); }
    .type-f { background-color: var(--tag-f-noun); color: var(--tag-f-noun-text); }
    .type-adj { background-color: var(--tag-adj); color: var(--tag-adj-text); }
    .type-other { background-color: var(--tag-other); color: var(--tag-other-text); }

    .meaning {
      font-size: 1.1rem;
      color: var(--accent-color);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .example-box {
      background-color: #f8f9fa;
      border-left: 3px solid var(--accent-color);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .example-es {
      font-size: 0.95rem;
      color: var(--ex-color);
      font-weight: 600;
      line-height: 1.3;
    }

    .example-en {
      font-size: 0.82rem;
      color: var(--en-color);
      font-style: italic;
      line-height: 1.2;
    }

    .example-ja {
      font-size: 0.85rem;
      color: var(--sub-color);
      line-height: 1.3;
      margin-top: 2px;
    }

    .loading-sentinel {
      padding: 30px;
      text-align: center;
    }

    .load-more-btn {
      padding: 12px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background-color: var(--accent-color);
      color: white;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(13, 110, 253, 0.3);
    }
    .load-more-btn:active {
      opacity: 0.8;
    }
  </style>
</head>

      { spanish: "luego", japanese: "後で", type: "adv", typeName: "副詞", exEs: "Hasta luego.", exEn: "See you later.", exJa: "また後で。" },
      { spanish: "entonces", japanese: "それでは", type: "conj", typeName: "接続詞", exEs: "¿Entonces qué hacemos?", exEn: "So what do we do?", exJa: "それではどうしましょうか？" },

      { spanish: "cuando", japanese: "〜の時", type: "conj", typeName: "接続詞", exEs: "Llama cuando llegues.", exEn: "Call when you arrive.", exJa: "着いたら電話して。" },
      { spanish: "donde", japanese: "〜する場所", type: "other", typeName: "関係詞", exEs: "¿Dónde está la estación?", exEn: "Where is the station?", exJa: "駅はどこですか？" },
      { spanish: "como", japanese: "〜のように", type: "conj", typeName: "接続詞", exEs: "Hazlo como quieras.", exEn: "Do it as you like.", exJa: "好きなようにやりなさい。" },

      { spanish: "gracias", japanese: "ありがとう", type: "other", typeName: "間投詞", exEs: "Muchas gracias por todo.", exEn: "Thank you very much for everything.", exJa: "いろいろとありがとう。" }
    ];

    // 配列をシャッフル（フィッシャー–イェーツのシャッフル）
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const vocabulary = shuffle(rawVocabulary);

    let dataIndex = 0;
    let isLoading = false;

    const cardList = document.getElementById("cardList");
    const sentinel = document.getElementById("sentinel");

    function getBadgeClass(type) {
      switch(type) {
        case 'v': return 'type-v';
        case 'm': return 'type-m';
        case 'f': return 'type-f';
        case 'adj': return 'type-adj';
        default: return 'type-other';
      }
    }

    function loadMoreCards(batchSize = 10) {
      if (isLoading) return;
      isLoading = true;

      for (let i = 0; i < batchSize; i++) {
        const item = vocabulary[dataIndex];

        const card = document.createElement("div");
        card.className = "card";

        const badgeClass = getBadgeClass(item.type);

        card.innerHTML = `
          <div class="word-header">
            <span class="word">${item.spanish}</span>
            <span class="type-badge ${badgeClass}">${item.typeName}</span>
          </div>
          <div class="meaning">${item.japanese}</div>
          <div class="example-box">
            <div class="example-es">${item.exEs}</div>
            <div class="example-en">${item.exEn}</div>
            <div class="example-ja">${item.exJa}</div>
          </div>
        `;

        cardList.appendChild(card);
        dataIndex = (dataIndex + 1) % vocabulary.length;
      }

      cardList.after(sentinel);
      
      setTimeout(() => {
        isLoading = false;
      }, 100);
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !isLoading) {
          loadMoreCards(10);
        }
      });
    }, {
      rootMargin: "300px"
    });

    observer.observe(sentinel);

    // 初期ロード（15件）
    loadMoreCards(15);
  </script>
