<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mi Vocabulario</title>
  <style>
    :root {
      --bg-color: #f1f3f5;
      --card-bg: #ffffff;
      --text-color: #212529;
      --sub-color: #6c757d;
      --accent-color: #0d6efd;
      --ex-color: #495057;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px 0 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .header {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(241, 243, 245, 0.9);
      backdrop-filter: blur(8px);
      text-align: center;
      padding: 12px 0;
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--sub-color);
      z-index: 10;
      border-bottom: 1px solid #e9ecef;
      margin-bottom: 16px;
    }

    .card-list {
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      box-sizing: border-box;
    }

    .word-container {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .word {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-color);
    }

    .num-tag {
      font-size: 0.75rem;
      color: #adb5bd;
      font-weight: bold;
    }

    .meaning {
      font-size: 1.1rem;
      color: var(--accent-color);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .example-box {
      background-color: #f8f9fa;
      border-left: 3px solid var(--accent-color);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
    }

    .example-es {
      font-size: 0.95rem;
      color: var(--ex-color);
      font-weight: 500;
      margin-bottom: 2px;
      line-height: 1.3;
    }

    .example-ja {
      font-size: 0.85rem;
      color: var(--sub-color);
      line-height: 1.3;
    }

    .loading-sentinel {
      padding: 30px;
      text-align: center;
    }

    .load-more-btn {
      padding: 12px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background-color: var(--accent-color);
      color: white;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(13, 110, 253, 0.3);
    }
    .load-more-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="header">単語・意味・例文リスト</div>

  <div class="card-list" id="cardList"></div>
  
  <div id="sentinel" class="loading-sentinel">
    <button class="load-more-btn" onclick="loadMoreCards(10)">さらに読み込む</button>
  </div>

      { spanish: "hablar", japanese: "話す", exEs: "Hablo un poco de español.", exJa: "スペイン語を少し話します。" },

      // --- 名詞 ---
      { spanish: "tiempo", japanese: "時間、天候", exEs: "No tengo tiempo.", exJa: "時間がありません。" },
      { spanish: "vez", japanese: "回、度", exEs: "Una vez más, por favor.", exJa: "もう一度お願いします。" },
      { spanish: "día", japanese: "日", exEs: "¡Buen día!", exJa: "良い一日を！" },
      { spanish: "año", japanese: "年", exEs: "Feliz año nuevo.", exJa: "明けましておめでとう。" },
      { spanish: "cosa", japanese: "もの、こと", exEs: "Hay otra cosa.", exJa: "もう一つ別のことがあります。" },
      { spanish: "hombre", japanese: "男性", exEs: "Es un hombre sabio.", exJa: "彼は賢い人です。" },

      { spanish: "vida", japanese: "生活、人生", exEs: "La vida es bella.", exJa: "人生は美しい。" },

      { spanish: "casa", japanese: "家", exEs: "Estoy en casa.", exJa: "家にいます。" },

      { spanish: "trabajo", japanese: "仕事", exEs: "Buen trabajo.", exJa: "お疲れ様（良い仕事をしました）。" },
      { spanish: "lugar", japanese: "場所", exEs: "Un lugar tranquilo.", exJa: "静かな場所。" },
      { spanish: "problema", japanese: "問題", exEs: "No hay problema.", exJa: "問題ありません。" },
      { spanish: "persona", japanese: "人", exEs: "Es una buena persona.", exJa: "彼は良い人です。" },
      { spanish: "parte", japanese: "部分", exEs: "Una gran parte del proyecto.", exJa: "プロジェクトの大きな部分。" },
      { spanish: "momento", japanese: "瞬間、時間", exEs: "Un momento, por favor.", exJa: "少々お待ちください。" },
      { spanish: "ciudad", japanese: "都市", exEs: "Vivo en esta ciudad.", exJa: "私はこの街に住んでいます。" },
      { spanish: "nombre", japanese: "名前", exEs: "¿Cuál es tu nombre?", exJa: "お名前は何ですか？" },
      { spanish: "país", japanese: "国", exEs: "Es un país hermoso.", exJa: "美しい国です。" },
      { spanish: "hora", japanese: "時間、時刻", exEs: "¿Qué hora es?", exJa: "今何時ですか？" },
      { spanish: "calle", japanese: "通り", exEs: "Cruza la calle.", exJa: "通りを渡りなさい。" },
      { spanish: "verdad", japanese: "真実", exEs: "Es la verdad.", exJa: "それは真実です。" },
      { spanish: "desarrollo", japanese: "開発、発展", exEs: "Desarrollo de software.", exJa: "ソフトウェア開発。" },
      { spanish: "desafío", japanese: "挑戦、課題", exEs: "Es un nuevo desafío.", exJa: "新しい挑戦です。" },

      // --- 形容詞 ---
      { spanish: "bueno", japanese: "良い", exEs: "¡Es muy bueno!", exJa: "とても良いですね！" },
      { spanish: "malo", japanese: "悪い", exEs: "No es una mala idea.", exJa: "悪いアイデアではない。" },
      { spanish: "grande", japanese: "大きい", exEs: "Una casa grande.", exJa: "大きな家。" },
      { spanish: "pequeño", japanese: "小さい", exEs: "Un detalle pequeño.", exJa: "小さな詳細。" },
      { spanish: "nuevo", japanese: "新しい", exEs: "Tengo un nuevo plan.", exJa: "新しい計画があります。" },
      { spanish: "viejo", japanese: "古い", exEs: "Un amigo viejo.", exJa: "古い友人。" },
      { spanish: "primer", japanese: "最初の", exEs: "Es el primer paso.", exJa: "これが一歩目です。" },
      { spanish: "último", japanese: "最後の、最近の", exEs: "La última versión.", exJa: "最新バージョン。" },

      // --- 副詞・接続詞・その他 ---

      { spanish: "menos", japanese: "より少なく", exEs: "Más o menos.", exJa: "だいたい（多かれ少なかれ）。" },

      { spanish: "como", japanese: "〜のように", exEs: "Hazlo como quieras.", exJa: "好きなようにやりなさい。" },
      { spanish: "si", japanese: "もし〜ならば", exEs: "Si tienes tiempo, ven.", exJa: "時間があったら来てね。" },
      { spanish: "gracias", japanese: "ありがとう", exEs: "Muchas gracias por todo.", exJa: "いろいろとありがとう。" }

    let dataIndex = 0;
    let totalCount = 0;
    let isLoading = false;

    const cardList = document.getElementById("cardList");
    const sentinel = document.getElementById("sentinel");

    function loadMoreCards(batchSize = 10) {
      if (isLoading) return;
      isLoading = true;

      for (let i = 0; i < batchSize; i++) {
        const item = vocabulary[dataIndex];
        totalCount++;

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="word-container">
            <div class="word">${item.spanish}</div>
            <div class="num-tag">#${totalCount}</div>
          </div>
          <div class="meaning">${item.japanese}</div>
          <div class="example-box">
            <div class="example-es">${item.exEs}</div>
            <div class="example-ja">${item.exJa}</div>
          </div>
        `;

        cardList.appendChild(card);
        dataIndex = (dataIndex + 1) % vocabulary.length;
      }

      cardList.after(sentinel);
      
      setTimeout(() => {
        isLoading = false;
      }, 100);
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !isLoading) {
          loadMoreCards(10);
        }
      });
    }, {
      rootMargin: "300px"
    });

    observer.observe(sentinel);

    // 初期ロード（15件）
    loadMoreCards(15);
  </script>
</body>
</html>
